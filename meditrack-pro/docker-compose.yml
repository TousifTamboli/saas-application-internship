services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meditrack-backend
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    # We pass the default values in case the .env is missing or variables aren't set
    environment:
      - PORT=5001
      # Note: Docker will read your backend/.env. If your Atlas URI is in there, it will connect.
      
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # This argument allows overriding the VITE API URL during docker build
        # We target the exposed host port 5001 so the browser can reach it.
        - VITE_API_BASE_URL=http://localhost:5001/api
    container_name: meditrack-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
